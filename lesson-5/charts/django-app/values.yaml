replicaCount: 2

image:
  repository: ''
  pullPolicy: IfNotPresent
  tag: 'latest'

service:
  type: LoadBalancer
  port: 80

configMap:
  DJANGO_SECRET_KEY: 'your-super-secret-key-change-in-prod'
  DEBUG: 'False'
  DATABASE_URL: 'postgres://user:pass@db:5432/mydb'
  REDIS_URL: 'redis://redis:6379/1'

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
